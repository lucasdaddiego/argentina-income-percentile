# Weekly version updates. The GitHub Actions entry keeps the SHA pins (and their version comments)
# in .github/workflows current; npm covers web/package-lock.json; uv covers uv.lock.
# Cooldown: a version must be 7 days old before its PR (hijacked releases surface within days).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
