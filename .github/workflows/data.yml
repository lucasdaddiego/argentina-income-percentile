name: Data reproduces INDEC

# The pipeline must still reproduce INDEC's published figures (`make data`), and the committed
# artifact must match what the pipeline emits. Path-filtered to the pipeline/data files so a
# web-only PR doesn't depend on INDEC's server — but web/public/percentiles.v1.json is one of the
# two committed copies of the artifact, so it is in the filter too: editing the *served* copy alone
# must not skip the only gate that checks it. The pinned source zip is cached on its checksum so
# reruns don't re-download it.
#
# Note: a PR/branch created by the monthly data-update workflow's GITHUB_TOKEN will NOT trigger
# this CI (a GitHub limitation). Checks appear once a human pushes to the bump branch. If you
# make this a required check, configure branch protection to treat a skipped run as passing
# (web-only PRs won't run it).

on:
  pull_request:
    paths:
      - "pipeline/**"
      - "data/**"
      - "web/public/percentiles.v1.json"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/data.yml"
  push:
    branches: [master, main]
    paths:
      - "pipeline/**"
      - "data/**"
      - "web/public/percentiles.v1.json"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/data.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data:
    name: Pipeline reproduces INDEC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Before `make data` overwrites them both: the committed provenance copy and the served copy
      # are written from one payload, so any divergence is a bad merge or a half-staged rebuild.
      - name: The two committed copies of the artifact are identical
        run: diff -q data/percentiles.v1.json web/public/percentiles.v1.json
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Sync Python deps
        run: uv sync
      - name: Cache the pinned INDEC source (keyed on the checksum pin)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: data/raw
          key: eph-raw-${{ hashFiles('data/checksums.txt') }}
      - name: Build + validate the data artifact
        run: make data
      - name: Committed artifact matches the pipeline output (numeric tolerance)
        run: |
          git show HEAD:data/percentiles.v1.json > committed-data.json
          git show HEAD:web/public/percentiles.v1.json > committed-web.json
          uv run python -m pipeline.artifact_check committed-data.json data/percentiles.v1.json
          uv run python -m pipeline.artifact_check committed-web.json web/public/percentiles.v1.json
