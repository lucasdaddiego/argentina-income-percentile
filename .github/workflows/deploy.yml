name: Web (test + deploy)

# One workflow for the web app, two jobs: `test` (typecheck, unit tests with the 100% coverage
# gate, production build) and `deploy`, which `needs: test`, so nothing reaches Cloudflare Pages
# that did not pass the tests on the same commit.
#   • push to master / main  -> production deploy (argentina-income-analyzer.pages.dev)
#   • pull request           -> preview deploy on a per-branch URL (same-repo PRs only: a fork PR
#                               gets no secrets, so it runs `test` alone)
#
# Path-filtered to the web app. The committed data artifact lives in
# web/public/percentiles.v1.json, so a `make data` refresh that updates it also redeploys.
#
# Requires two repository secrets (Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   — a token with the "Account · Cloudflare Pages · Edit" permission
#   CLOUDFLARE_ACCOUNT_ID  — the Cloudflare account id that owns the Pages project
# Until CLOUDFLARE_API_TOKEN is set the deploy job still builds, but skips the upload (with a
# warning) rather than failing red.
#
# Every action is pinned to a commit SHA (the comment names the tag); Dependabot moves both.

on:
  push:
    branches: [master, main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  pull_request:
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same PR cancels the superseded run; a production deploy is never cancelled
# mid-upload.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Typecheck + tests (100% coverage) + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        run: npm ci
        working-directory: web
      - name: Unit tests + coverage (100% gate)
        run: npm run test:cov
        working-directory: web
      - name: Typecheck + build
        run: npm run build
        working-directory: web

  deploy:
    name: Build + deploy
    needs: test
    runs-on: ubuntu-latest
    # Fork PRs don't receive the deploy secrets — skip them (the test job above still ran).
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install + build
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Are the deploy secrets present?
        id: gate
        env:
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CF_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::CLOUDFLARE_API_TOKEN is not set — built OK but skipping the deploy."
          fi

      - name: Deploy to Cloudflare Pages
        if: steps.gate.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          # PR -> preview on the PR branch; push -> production (the project's production branch is master).
          command: pages deploy dist --project-name=argentina-income-analyzer --branch=${{ github.event_name == 'pull_request' && github.head_ref || 'master' }}

      - name: Deployment URL -> summary
        if: steps.gate.outputs.ready == 'true' && success()
        run: |
          {
            echo "### 🚀 Deployed to Cloudflare Pages"
            echo "- Trigger: \`${{ github.event_name }}\`"
            echo "- Deploy branch: \`${{ github.event_name == 'pull_request' && github.head_ref || 'master' }}\`"
            echo "- URL: ${{ steps.deploy.outputs.deployment-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
